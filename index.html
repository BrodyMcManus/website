<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brody McManus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e9e4d4;
      --text-dim: #a09c8f;
      --rule: #2a2d3a;
      --accent: #f2b143;
      --serif: "Fraunces", "EB Garamond", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-weight: 350;
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 6rem 1.5rem 4rem;
    }
    h1 {
      font-weight: 300;
      font-variation-settings: "opsz" 144, "SOFT" 30;
      font-size: clamp(2.4rem, 5.5vw, 3.6rem);
      line-height: 1.05;
      margin: 0 0 3rem;
    }
    .label {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 1rem 0; border-top: 1px solid var(--rule); }
    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--accent); }
    .sub { color: var(--text-dim); font-size: 0.95rem; }
    .sub a { color: var(--text-dim); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Brody McManus</h1>
    <div class="label">Writing</div>
    <ul>
      <li>
        <a href="solar-orbit-allocation/">How to allocate orbits around the sun</a>
        <div class="sub">Working draft &middot; <a href="solar-orbit-allocation/orbital-elements/">Interactive: how do we describe an orbit?</a></div>
      </li>
    </ul>
  </main>
</body>
</html>
